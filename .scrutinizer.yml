# Scrutinizer (https://scrutinizer-ci.com): code rating and analysis. Tests, the race detector and the network lab
# run in the GitHub workflows (.github/workflows/ci.yml), so here the code is only built and analysed.
# The Go of Scrutinizer's build image is too old for Go modules, so the analysis node installs the Go version that
# go.mod names and puts it first on the PATH of every command (with its GOROOT: the image's gvm sets an old one).
checks:
  go: true

filter:
  excluded_paths:
    - "*_test.go"
    - "*/testdata/*"
    - "lab/*"
    - "docs/*"

build:
  environment:
    variables:
      # the build image sets these for the Go of 2017; the current Go needs its defaults back
      GOTOOLCHAIN: local
      GO111MODULE: "on"
      GOPROXY: https://proxy.golang.org,direct
      GOFLAGS: -mod=mod
  nodes:
    analysis:
      project_setup:
        override:
          - "true"
      dependencies:
        override:
          - mkdir -p "$HOME/go1.27" && curl -fsSL https://go.dev/dl/go1.27.4.linux-amd64.tar.gz | tar -C "$HOME/go1.27" --strip-components=1 -xz
          - GOROOT="$HOME/go1.27" PATH="$HOME/go1.27/bin:$PATH" go version
          - GOROOT="$HOME/go1.27" PATH="$HOME/go1.27/bin:$PATH" go mod download
      tests:
        override:
          - GOROOT="$HOME/go1.27" PATH="$HOME/go1.27/bin:$PATH" go build ./...
          - GOROOT="$HOME/go1.27" PATH="$HOME/go1.27/bin:$PATH" go-scrutinizer-run
          - GOROOT="$HOME/go1.27" PATH="$HOME/go1.27/bin:$PATH" govet-run
          # coverage of the unit tests (the network lab needs privileged Docker and runs in GitHub Actions; the
          # coverage of both together is on qlty.sh)
          - command: GOROOT="$HOME/go1.27" PATH="$HOME/go1.27/bin:$PATH" CGO_ENABLED=0 go test -count=1 -coverpkg=./... -coverprofile=cover.out ./...
            coverage:
              file: cover.out
              format: go-cc
    # the test node does nothing: the tests (with the race detector and the lab) run in GitHub Actions
    tests:
      project_setup:
        override:
          - "true"
      dependencies:
        override:
          - "true"
      tests:
        override:
          - "true"
