name: release
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
  packages: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.27"
      # the same checks as ci.yml: a tag can be pushed on a commit CI never saw
      - run: test -z "$(gofmt -l cmd internal games)"
      - run: go mod tidy -diff
      - run: go vet ./...
      - run: GOOS=windows go vet ./...
      - run: go run github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.15.0 run ./...
      - run: sh tools/complexity.sh
      - run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...
      - run: go test -count=1 ./...
      - name: Tests with the race detector
        run: go test -race -count=1 ./...
        env:
          CGO_ENABLED: "1"
      - name: Build binaries
        run: |
          mkdir -p dist
          for arch in amd64 arm64; do
            CGO_ENABLED=0 GOOS=linux GOARCH=$arch go build -trimpath \
              -ldflags "-s -w -X main.version=${GITHUB_REF_NAME} -X main.commit=${GITHUB_SHA}" \
              -o dist/nsrelay-linux-$arch ./cmd/nsrelay
          done
          cd dist && sha256sum nsrelay-* > SHA256SUMS
      - name: Release notes from CHANGELOG.md
        run: |
          v="${GITHUB_REF_NAME#v}"
          awk -v v="$v" '$0 ~ "^## \\[" v "\\]" {on=1; next} /^## \[/ {on=0} on' CHANGELOG.md > notes.md
          printf '\n---\nDocker image: `ghcr.io/%s:%s`\n' "${GITHUB_REPOSITORY,,}" "$GITHUB_REF_NAME" >> notes.md
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # a release left over from an earlier push of the same tag is replaced (the tag itself stays)
          gh release delete "$GITHUB_REF_NAME" --yes 2>/dev/null || true
          pre=""
          case "$GITHUB_REF_NAME" in *-*) pre="--prerelease" ;; esac
          gh release create "$GITHUB_REF_NAME" dist/* --title "Netsession Relay $GITHUB_REF_NAME" --notes-file notes.md $pre
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Image name and tags
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          {
            echo "TAGS<<EOF"
            echo "$image:$GITHUB_REF_NAME"
            # "latest" follows final releases only: a pre-release tag (v1.2.0-rc.1) has a "-" suffix
            case "$GITHUB_REF_NAME" in *-*) ;; *) echo "$image:latest" ;; esac
            echo "EOF"
          } >> "$GITHUB_ENV"
      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: false
          build-args: |
            VERSION=${{ github.ref_name }}
            COMMIT=${{ github.sha }}
          tags: ${{ env.TAGS }}
      # rebuilding a tag leaves the previous image index and its platform images untagged; delete them. The action
      # keeps every platform image a tagged index still points to (a plain "delete untagged" would break the tags).
      - uses: dataaxiom/ghcr-cleanup-action@v1.2.2
        with:
          package: netsession-relay
          delete-untagged: true
