name: cleanup-images
# Weekly, and by hand (Actions > cleanup-images > Run workflow): delete untagged images in the container registry.
# Multi-architecture aware: platform images that a tagged image still points to are kept.
on:
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:
    inputs:
      dry-run:
        description: "Only list what would be deleted"
        type: boolean
        default: false
permissions:
  packages: write
jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: dataaxiom/ghcr-cleanup-action@v1.2.2
        with:
          package: netsession-relay
          delete-untagged: true
          dry-run: ${{ inputs.dry-run || false }}
