name: ci
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.26"
      - run: test -z "$(gofmt -l cmd internal games)"
      - run: go mod tidy -diff
      - run: go vet ./...
      - run: GOOS=windows go vet ./...
      - run: go run honnef.co/go/tools/cmd/staticcheck@2025.1.1 -checks all,-ST1000,-ST1003 ./...
      - run: go run golang.org/x/vuln/cmd/govulncheck@v1.1.4 ./...
      - run: go test -count=1 ./...
      - name: Tests with the race detector
        run: go test -race -count=1 ./...
        env:
          CGO_ENABLED: "1"

  # The real engine between network namespaces (lab/): VLAN bridge, tables, a second relay.
  lab:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.26"
      # VLAN interfaces, the bridge and nftables come from kernel modules of the runner; the lab container cannot
      # load them itself
      - run: sudo modprobe -a 8021q bridge nf_tables
      - run: bash lab/run-docker.sh
