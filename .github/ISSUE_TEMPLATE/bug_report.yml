name: Bug report
description: Something does not work as described
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
  - type: textarea
    id: status
    attributes:
      label: Output of `nsrelay admin status` and the game's diagnosis in the UI
      description: Remove addresses you do not want to share.
      render: text
  - type: input
    id: version
    attributes:
      label: Version (`nsrelay version`)
    validations:
      required: true
  - type: input
    id: env
    attributes:
      label: Environment
      placeholder: "Debian 13 VM on Proxmox, Docker 29, trunk with 17 VLANs"
