- id: flatout_uc
  name: 'FlatOut: Ultimate Carnage (2008)'
  aliases:
  - FOUC
  - FlatOut UC Collector's Edition (Steam AppID 12360)
  - FOUC ZOOM Platform
  - FOUC GFWL
  category: game
  relay_needed: unknown
  default_enabled: false
  pinned: true
  confidence: medium
  source_ip: unknown
  notes: 'Version zoo. (a) Retail/GFWL and Steam beta branch `gfwl`: Games for Windows LIVE incl. System Link. With xlivelessness
    (XLLN) as GFWL replacement, lobbies are announced via XLLN''s own broadcast on UDP 39000 (see entry xlivelessness), not
    3074; users report lobbies found but kicked on race start (XLLN issue #30). (b) Steam main branch: native Steamworks lobbies
    since 2026-11-09 => no relay. (c) ZOOM Platform (since 2026-11-10, default MP mode) and Steam without running Steam client
    or with ForceLAN=1 in zoom_flatout.ini: new LAN mode, 8 players, Versus; PCGamingWiki lists no ports, only UPnP=true and
    direct IP=false (so browser discovery is the only way to join). NEW (2026-11-16): the FOUC exe has the Bugbear settings
    "Network.Port" and "Network.BroadcastPort" (settings table at 0x71B518, values at 0x849560/0x849564, read out by the Chloe
    Collection plugin). FlatOut 1/2 use the same Bugbear names with 23756 (game) / 23757 (lobby broadcast). Strong hint that
    the new LAN mode reuses the FO2 LAN code on 23756/23757, but the DEFAULT VALUES in FOUC are not published -> capture at
    the event before enabling. If the capture shows 23757 broadcast: copy discovery/game_ports from flatout2. (d) FOUC Chloe
    Collection mod: server IP input, no broadcast.'
