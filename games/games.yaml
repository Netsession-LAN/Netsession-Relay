- id: xlivelessness
  name: xlivelessness (XLLN, GFWL replacement) LAN lobbies
  aliases:
  - XLLN
  - xlive.dll replacement
  - GFWL LAN via xlivelessness
  category: platform
  relay_needed: 'yes'
  default_enabled: false
  confidence: medium
  source_ip: original
  discovery:
  - kind: broadcast
    ports: '39000'
    direction: both
  game_ports:
    udp: 39001-39004
  notes: 'From the XLLN source (xlln-config.cpp): xlln_network_instance_base_port default 39000 = "the shared port between
    all local XLLN instances used for broadcasting/communicating available lobbies/games/matches"; each instance uses base
    port + local instance id (usually 1 => 39001) for its traffic. Sessions are advertised by broadcast (live-over-lan.cpp,
    INADDR_BROADCAST). Received packets are parsed together with the recvfrom source address (xlln-network.cpp) => keep the
    original source. Extra broadcast targets can be set in xlive_broadcast_address (e.g. other VLAN broadcast addresses) as
    a relay-free fallback. Used by GFWL titles like FlatOut: Ultimate Carnage (gfwl branch), Halo 2 Vista etc. game_ports
    range 39001-39004 covers up to 4 instances per PC (assumption).'
  sources:
  - https://gitlab.com/GlitchyScripts/xlivelessness
  - https://gitlab.com/GlitchyScripts/xlivelessness/-/issues/30

