# Netsession Relay - game database (seed). Edit this file directly; sources per entry in `sources`.
# Validated by `go test ./internal/gamedb ./internal/compile` (strict: unknown fields are errors).
#
# Fields
#   id               slug [a-z0-9_]+, unique
#   category         game | platform (shared stack: Steam, DirectPlay, GameSpy, ...) | noise (NetBIOS, mDNS, SSDP, ...)
#   relay_needed     yes (has discovery specs) | no (no LAN broadcast, e.g. Steam lobby only) | unknown (measure on site)
#   default_enabled  switched on in a new event by default
#   pinned           optional, true = listed first inside its group of the games list (the titles an event is known for)
#   confidence       high | medium | low
#   source_ip        original = game needs the original sender IP | relay = rewriting is harmless | unknown
#   discovery[]      kind broadcast|multicast, ports (portspec: "27015-27020", "2302-2470/12", "6111,6112"),
#                    group (multicast only), direction query|announce|both,
#                    optional: dst_mode keep|subnet|limited, ttl_mode keep|decrement, rate_pps, rate_burst, payload_max
#   game_ports       unicast game traffic after discovery (NOT relayed, must be routed between VLANs), by protocol
#   notes, sources   research notes and URLs

- id: flatout1
  name: FlatOut (2004)
  aliases:
  - FlatOut 1
  - FO1
  - FlatOut Steam (AppID 6220)
  - FlatOut GOG
  - FlatOut ZOOM Platform
  category: game
  relay_needed: 'yes'
  default_enabled: true
  pinned: true
  confidence: high
  source_ip: relay
  discovery:
  - kind: broadcast
    ports: '23757'
    direction: both
  game_ports:
    udp: '23756'
  notes: 'Verified from source code of gaycoderprincess'' FlatOutOnlinePlay plugin (v1.1 exe): port 23756 = gameplay ("port_game"),
    23757 = "lobby broadcast port". Client sends the lobby query via broadcast to :23757. The host''s answer (106-byte server-info
    struct) is in vanilla ALSO sent as broadcast (the plugin patches 0x4955BD to "reply back with server info to the sender''s
    address instead of broadcast"). The server-info struct carries the host IP at offset 0x18; the plugin overwrites it with
    the packet source because the game otherwise uses the embedded (private) IP. => Client connects to the IP inside the payload,
    not to the packet source. Source rewriting by the relay is therefore harmless, BUT the relay must forward 23757 in both
    directions (it does: same port) and the host''s real IP must be routable/allowed on 23756 between VLANs. Multi-NIC PCs
    (VirtualBox, Hyper-V, VPN adapters) can embed the wrong IP -> disable extra adapters. No GameSpy online in FO1 originally;
    23755 is only the plugin''s own HTTP master server.'
  sources:
  - https://github.com/gaycoderprincess/FlatOutOnlinePlay
  - https://raw.githubusercontent.com/gaycoderprincess/FlatOutOnlinePlay/HEAD/main.cpp
  - https://raw.githubusercontent.com/gaycoderprincess/FlatOutOnlinePlay/HEAD/FlatOutOnlinePlay_gcp.toml
  - https://steamcommunity.com/app/6220/discussions/0/1741104717717633846/

- id: flatout2
  name: FlatOut 2 (2006)
  aliases:
  - FO2
  - FlatOut 2 retail/CD v1.0-1.2
  - FlatOut 2 Steam (AppID 2990)
  - FlatOut 2 GOG
  - FlatOut 2 ZOOM Platform
  - FlatOut 2 Super Digital Deluxe
  category: game
  relay_needed: 'yes'
  default_enabled: true
  pinned: true
  confidence: high
  source_ip: relay
  discovery:
  - kind: broadcast
    ports: '23757'
    direction: both
  game_ports:
    udp: '23756'
  notes: '23757 = LAN discovery to 255.255.255.255 (SDH: "Flatout 2 - Works", also in GB whitelist). 23756 = game port (portforward.com,
    FO2 Chloe Online docs). Some forum guides list 23756-23758 TCP+UDP; 23758 is not confirmed as LAN-relevant. Same Bugbear
    netcode lineage as FO1; the official v1.1 patch notes document "-private_addr=ip: Forces the game to report this private
    address to other players" => host IP travels inside the payload like in FO1, so source rewriting (-s 1.1.1.2) should be
    harmless; NOT yet verified by capture for FO2 (do a Wireshark check: does the client connect to the host''s real IP on
    23756 after a relayed discovery?). LAN mode is identical in retail 1.2, Steam, GOG and ZOOM builds as far as known (GOG
    staff: LAN works; Steam/ZOOM builds only changed the online master from GameSpy to OpenSpy). Command line: -lan -host
    / -lan -join=IP[:port]. Known pitfall: several active NICs (VirtualBox host-only etc.) => games don''t show up. Steam/ZOOM
    v1.2 online: OpenSpy (no relay needed).'
  sources:
  - https://github.com/OpenSourceLAN/service-discovery-helper/blob/master/GAMES.md
  - https://github.com/netwarlan/gamebridge
  - https://worthplaying.com/article/2006/9/1/news/35877-flatout-2-v11-euro-beta-patch-available-now/
  - https://portforward.com/flatout-2/
  - https://flatout-itf.ucoz.ru/forum/8-65-1
