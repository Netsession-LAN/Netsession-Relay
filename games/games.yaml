- id: ut99
  name: Unreal Tournament (1999) / UT GOTY / Unreal Gold
  aliases:
  - UT99
  - UT Classic
  - OldUnreal UT 469
  category: game
  relay_needed: 'yes'
  default_enabled: true
  confidence: high
  source_ip: original
  discovery:
  - kind: broadcast
    ports: 8777-8786
    direction: query
  game_ports:
    udp: 7777-7779
  notes: 'Verified in the UnrealScript source (v436): UBrowserLocalLink.BroadcastBeacon sends "REPORTQUERY" to BroadcastAddr
    on ServerBeaconPort+0..9 (8777-8786). The server''s UdpBeacon binds 8777 (next free port for further servers) and answers
    "ut <queryport>" UNICAST to the sender. The client builds the server address from the packet SOURCE IP plus the query
    port from the text => original source IP required. UdpBeacon also sends one startup announcement to broadcast :9777 (BeaconPort),
    not needed for the browser. SDH: tested at DreamHack.'
  sources:
  - https://eatsleeput.com/undox/Uncodex-UT99-v436/Source_ubrowser/ubrowserlocallink.html
  - https://eatsleeput.com/undox/Uncodex-UT99-v436/Source_ipdrv/udpbeacon.html
