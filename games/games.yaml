- id: directplay4
  name: DirectPlay 1-7 (generic, used by many 1996-2003 games)
  aliases:
  - DPlay
  - DirectPlay TCP/IP service provider
  category: platform
  relay_needed: 'yes'
  default_enabled: true
  confidence: high
  source_ip: original
  discovery:
  - kind: broadcast
    ports: '47624'
    direction: query
  game_ports:
    tcp: 2300-2400,47624
    udp: 2300-2400
  notes: 'Microsoft protocol spec MC-DPL4CS: the client sends DPSP_MSG_ENUMSESSIONS to the broadcast address on UDP 47624
    and then listens for DPSP_MSG_ENUMSESSIONSREPLY on its DirectPlay TCP port. The message header carries a SockAddr with
    the client''s port (sample: 2300) and address 0.0.0.0 => the host must use the packet SOURCE IP to reach the client. With
    source rewriting (-s 1.1.1.2 on the old box51) the host tries to open TCP to the relay => enumeration fails. TCP 2300-2400
    must be routable in BOTH directions between VLANs (host -> client for the reply). Microsoft KB 240429/895864 list 47624
    + 2300-2400. Modern Windows needs the DirectPlay optional feature.'
  sources:
  - https://learn.microsoft.com/en-us/openspecs/windows_protocols/mc-dpl4cs/93c87268-5f7c-4870-ad40-a05bcf13f00d
  - https://msdn.microsoft.com/en-us/library/cc216901.aspx
  - https://msdn.microsoft.com/en-us/library/cc216831.aspx
  - https://infania.net/misc/kbarchive/kb/240/Q240429/index.html
  - https://ftp.zx.net.nz/pub/archive/ftp.microsoft.com/MISC/KB/en-us/895/864.HTM

