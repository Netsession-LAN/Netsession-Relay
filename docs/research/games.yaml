# LAN discovery ports of PC games (UDP broadcast / multicast)
# Research state: 2026-11-16. Prose and reasoning: 02-game-ports.md
#
# Field semantics
#   discovery[].type   broadcast | multicast (then `group`) | none (no LAN discovery, nothing to relay)
#   discovery[].direction  (optional) query = clients search, hosts answer
#                          announce = host advertises periodically
#                          both    = both directions use the port (relay must be bidirectional anyway)
#   game_ports         ports used AFTER discovery (unicast, must be routed/allowed between VLANs; NOT relayed)
#   source_ip          original = game needs the original sender IP (reply goes unicast to the packet source,
#                                 or the packet source is used as the host address) -> relay must NOT rewrite source
#                      relay    = rewriting the source to the relay IP is harmless (host address is inside the payload
#                                 and/or replies are broadcast as well)
#                      unknown  = not verified
#   confidence         high   = source code, protocol documentation or LAN-event tested port list
#                      medium = several consistent secondary sources, or engine default
#                      low    = single/unverified source or inference; verify with Wireshark before relying on it
#
# Abbreviated sources used repeatedly:
#   SDH      = https://github.com/OpenSourceLAN/service-discovery-helper (GAMES.md + `ports`, tested at PAX Aus 2016 / DreamHack DE)
#   GB       = https://github.com/netwarlan/gamebridge (gamebridge_setup.txt, NETWAR LAN party ebtables whitelist, no game names)
#   VPNPARTY = https://github.com/tvladyslav/vpnparty (verified games table)

