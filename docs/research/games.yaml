- id: steam_lan_browser
  name: "Steam server browser – LAN tab (generic, all Steamworks game servers)"
  aliases: ["A2S LAN query", "SteamMatchmakingServers RequestLANServerList"]
  discovery:
    - {proto: udp, ports: [27015, 27016, 27017, 27018, 27019, 27020], type: broadcast, direction: query}
    - {proto: udp, ports: [26900, 26901, 26902, 26903, 26904, 26905, 4242, 27215], type: broadcast, direction: query}
  source_ip: original
  notes: >-
    Client broadcasts A2S_INFO to 255.255.255.255; servers answer unicast to the packet source => relay must keep the
    original source IP (no -s). 27015-27020 tested (SDH). The second port group is listed by SDH as "Other ports Steam
    searches" and also appears in the GB whitelist (27215, 4242, 26900-26905); not officially documented -> medium.
  confidence: medium
  sources:
